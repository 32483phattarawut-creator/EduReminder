<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EduReminder | Student Planner</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root {
  --green: #789b83;
  --green-dark: #52765e;
  --green-light: #eaf1eb;
  --bg: #f6f8f5;
  --white: #ffffff;
  --text: #29372e;
  --muted: #849087;
  --border: #e7ece7;
  --red: #d66b6b;
  --shadow: 0 5px 20px rgba(45,70,50,.06);
}

* {
  box-sizing: border-box;
  font-family: 'Sarabun', sans-serif !important;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
}

button, input, select, textarea { font: inherit; }
button { cursor: pointer; }

.layout { display: flex; min-height: 100vh; }

.sidebar {
  width: 245px;
  background: white;
  border-right: 1px solid var(--border);
  padding: 25px 18px;
  position: fixed;
  top: 0;
  bottom: 0;
  left: 0;
  display: flex;
  flex-direction: column;
  z-index: 10;
}

.brand {
  display: flex;
  align-items: center;
  gap: 11px;
  padding: 5px 8px 30px;
}

.brand-logo {
  width: 48px;
  height: 48px;
  object-fit: contain;
  object-position: center;
  border-radius: 0;
  display: block;
  flex-shrink: 0;
}

.brand-name {
  font-size: 19px;
  font-weight: 800;
  color: var(--green-dark);
}

.brand-sub { font-size: 11px; color: var(--muted); }

.menu-label {
  font-size: 11px;
  color: #a0aaa2;
  font-weight: 700;
  padding: 12px 12px 8px;
}

.nav-btn {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  padding: 12px 14px;
  margin: 3px 0;
  border: 0;
  background: transparent;
  color: #718076;
  border-radius: 10px;
  text-align: left;
  font-size: 14px;
  transition: .2s;
}

.nav-btn:hover, .nav-btn.active {
  background: var(--green-light);
  color: var(--green-dark);
}

.nav-btn.active { font-weight: 700; }

.nav-icon {
  width: 19px;
  height: 19px;
  flex-shrink: 0;
}

.sidebar-bottom {
  margin-top: auto;
  padding: 14px;
  background: var(--green-light);
  border-radius: 12px;
  font-size: 12px;
  color: var(--green-dark);
  line-height: 1.7;
}

.main {
  margin-left: 245px;
  width: calc(100% - 245px);
  padding: 30px 36px;
  max-width: 1600px;
}

.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 15px;
  margin-bottom: 28px;
}

.page-title { font-size: 25px; font-weight: 800; margin: 0; }

.page-subtitle {
  font-size: 13px;
  color: var(--muted);
  margin-top: 4px;
}

.today {
  font-size: 13px;
  color: var(--muted);
  background: white;
  padding: 10px 15px;
  border: 1px solid var(--border);
  border-radius: 10px;
}

.btn {
  border: 0;
  border-radius: 9px;
  padding: 10px 16px;
  font-weight: 600;
  font-size: 13px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  transition: .2s;
}

.btn-primary { background: var(--green); color: white; }
.btn-primary:hover { background: var(--green-dark); }
.btn-light { background: var(--green-light); color: var(--green-dark); }
.btn-danger { background: #fbeeee; color: var(--red); }
.btn-outline { background: white; border: 1px solid var(--border); color: var(--text); }
.btn svg { width: 16px; height: 16px; }

.stats {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 16px;
  margin-bottom: 22px;
}

.stat-card {
  background: white;
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 19px;
  box-shadow: var(--shadow);
}

.stat-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  color: var(--muted);
  font-size: 13px;
}

.stat-icon {
  width: 35px;
  height: 35px;
  border-radius: 10px;
  background: var(--green-light);
  display: grid;
  place-items: center;
  color: var(--green-dark);
}

.stat-icon svg { width: 19px; height: 19px; }
.stat-number { font-size: 29px; font-weight: 800; margin-top: 10px; }
.stat-note { font-size: 11px; color: var(--muted); margin-top: 2px; }

.content-grid {
  display: grid;
  grid-template-columns: 1.6fr 1fr;
  gap: 18px;
}

.panel {
  background: white;
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 20px;
  box-shadow: var(--shadow);
  margin-bottom: 18px;
  min-width: 0;
}

.panel-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  margin-bottom: 17px;
}

.panel-title { font-size: 16px; font-weight: 700; margin: 0; }
.muted { color: var(--muted); font-size: 12px; }

.task-list { display: flex; flex-direction: column; gap: 10px; }

.task-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 13px;
  border: 1px solid var(--border);
  border-radius: 11px;
  transition: .2s;
}

.task-item:hover { border-color: #cbdacb; }
.task-check { width: 18px; height: 18px; accent-color: var(--green); flex-shrink: 0; }
.task-info { flex: 1; min-width: 0; }
.task-name { font-size: 14px; font-weight: 600; overflow-wrap: anywhere; }

.task-completed .task-name {
  text-decoration: line-through;
  color: #a2aaa3;
}

.task-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 5px;
  font-size: 11px;
  color: var(--muted);
}

.tag {
  display: inline-block;
  padding: 3px 9px;
  border-radius: 20px;
  background: var(--green-light);
  color: var(--green-dark);
  font-size: 10px;
  white-space: nowrap;
}

.tag.exam { background: #fff2df; color: #b47d29; }
.tag.homework { background: #eaf0ff; color: #647db4; }
.tag.project { background: #f2eafb; color: #936eb0; }
.tag.other { background: #f0f1f0; color: #747e76; }

.task-actions { display: flex; gap: 5px; }

.icon-btn {
  border: 0;
  background: transparent;
  color: #879188;
  padding: 6px;
  border-radius: 7px;
}

.icon-btn:hover { background: var(--green-light); color: var(--green-dark); }
.icon-btn svg { width: 17px; height: 17px; display: block; }

.empty {
  text-align: center;
  padding: 35px 10px;
  color: var(--muted);
  font-size: 13px;
}

.toolbar {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin-bottom: 17px;
}

.field {
  background: white;
  border: 1px solid var(--border);
  border-radius: 9px;
  padding: 10px 12px;
  outline: none;
  color: var(--text);
  font-size: 13px;
  min-width: 0;
}

.field:focus { border-color: var(--green); }
.search-field { flex: 1; min-width: 150px; }

.calendar-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 17px;
  gap: 10px;
}

.calendar-month { font-size: 18px; font-weight: 700; }

.calendar-grid {
  display: grid;
  grid-template-columns: repeat(7, minmax(0, 1fr));
  gap: 5px;
}

.calendar-day-name {
  text-align: center;
  font-size: 11px;
  color: var(--muted);
  padding: 8px 0;
}

.calendar-cell {
  min-height: 75px;
  background: #fafcf9;
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 7px;
  font-size: 12px;
  cursor: pointer;
  overflow: hidden;
}

.calendar-cell:hover { border-color: var(--green); }
.calendar-cell.today-cell { background: var(--green-light); border-color: var(--green); }
.calendar-cell.muted-cell { opacity: .35; }

.calendar-event {
  background: var(--green);
  color: white;
  border-radius: 4px;
  padding: 2px 4px;
  margin-top: 4px;
  font-size: 9px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.setting-row {
  padding: 15px 0;
  border-bottom: 1px solid var(--border);
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
}

.setting-row:last-child { border-bottom: 0; }
.setting-title { font-size: 14px; font-weight: 600; }
.setting-desc { color: var(--muted); font-size: 11px; margin-top: 3px; }

.modal-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(25,40,30,.4);
  display: none;
  justify-content: center;
  align-items: center;
  padding: 15px;
  z-index: 30;
}

.modal-backdrop.show { display: flex; }

.modal {
  background: white;
  width: 100%;
  max-width: 480px;
  border-radius: 16px;
  padding: 23px;
  max-height: 90vh;
  overflow-y: auto;
  box-shadow: 0 15px 50px rgba(0,0,0,.15);
}

.modal-title { font-size: 19px; font-weight: 800; margin: 0 0 20px; }
.form-group { margin-bottom: 14px; }

.form-label {
  display: block;
  font-size: 12px;
  font-weight: 600;
  margin-bottom: 6px;
}

.form-group .field { width: 100%; }

.form-actions {
  display: flex;
  justify-content: flex-end;
  gap: 9px;
  margin-top: 20px;
}

.page { display: none; }
.page.active { display: block; }

.auth-screen {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.auth-card {
  width: 100%;
  max-width: 420px;
  background: white;
  border: 1px solid var(--border);
  border-radius: 18px;
  padding: 30px;
  box-shadow: var(--shadow);
}

.auth-brand {
  display: flex;
  align-items: center;
  gap: 12px;
  justify-content: center;
  margin-bottom: 22px;
}

.auth-brand img { width: 52px; height: 52px; object-fit: contain; }
.auth-title { text-align: center; font-size: 22px; font-weight: 800; margin: 0; }
.auth-desc { text-align: center; color: var(--muted); font-size: 13px; margin: 6px 0 22px; }
.auth-card .field { width: 100%; }
.auth-message { font-size: 12px; color: var(--green-dark); line-height: 1.7; margin-top: 12px; min-height: 18px; }
.auth-switch { text-align: center; font-size: 13px; color: var(--muted); margin-top: 16px; }
.auth-switch button { border: 0; background: transparent; color: var(--green-dark); font-weight: 700; }
.auth-screen[hidden], .layout[hidden] { display: none !important; }

.account-area {
  display: flex;
  align-items: center;
  gap: 10px;
}

.account-email {
  color: var(--muted);
  font-size: 12px;
  max-width: 220px;
  overflow: hidden;
  text-overflow: ellipsis;
}

@media(max-width:1000px) {
  .stats { grid-template-columns: repeat(2, 1fr); }
  .content-grid { grid-template-columns: 1fr; }
}

@media(max-width:700px) {
  .sidebar { width: 68px; padding: 15px 8px; }
  .brand { justify-content: center; padding: 5px 0 25px; }
  .brand-logo { width: 43px; height: 43px; object-fit: contain; border-radius: 0; }
  .brand-name, .brand-sub, .menu-label, .nav-text, .sidebar-bottom { display: none; }
  .nav-btn { justify-content: center; padding: 13px 5px; }
  .nav-icon { width: 21px; height: 21px; }
  .main { margin-left: 68px; width: calc(100% - 68px); padding: 20px 13px; }
  .page-title { font-size: 21px; }
  .today { display: none; }
  .stats { gap: 9px; }
  .stat-card { padding: 13px; }
  .stat-number { font-size: 24px; }
  .panel { padding: 14px; }
  .task-item { padding: 10px 8px; }
  .calendar-cell { min-height: 58px; padding: 4px; }
  .calendar-event { font-size: 8px; }
  .account-email { display: none; }
  .auth-card { padding: 22px; }
}

@media(max-width:380px) {
  .stats { grid-template-columns: 1fr 1fr; }
  .task-actions { flex-direction: column; }
}
</style>
</head>
